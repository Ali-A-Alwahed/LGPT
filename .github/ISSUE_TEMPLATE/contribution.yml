name: Contribution
description: Clarifications, translations, tooling, and documentation.
title: "[contribution] "
labels: ["contribution"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type of contribution
      options:
        - Documentation improvement
        - Tooling (installer / Action / CI)
        - Translation
        - Clarification of existing text
        - New license text proposal
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **If you are proposing a change to `LICENSE.txt` itself**, please open an
        issue first rather than a PR. Changes to the license text are
        high-stakes: they need discussion, they bump the version, and a small
        focused change is far more likely to be accepted. See
        [CONTRIBUTING.md](https://github.com/Ali-A-Alwahed/LGPT/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: what
    attributes:
      label: What does this change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What is unclear, wrong, or missing right now?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How did you verify this?
      description: |
        If you touched the license text, the installer, or the Action, paste the
        output of `./scripts/ci-check.sh`.
      render: shell
  - type: checkboxes
    id: done
    attributes:
      label: Checklist
      options:
        - label: If I changed `LICENSE.txt`, I ran `./scripts/refresh-checksums.sh`.
          required: false
        - label: If I changed `src/index.js`, I ran `./scripts/build-action.sh`.
          required: false
        - label: This is a single focused change, not several bundled together.
          required: true
        - label: I have read [CONTRIBUTING.md](https://github.com/Ali-A-Alwahed/LGPT/blob/main/CONTRIBUTING.md).
          required: true